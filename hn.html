<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Bản Đồ Việt Nam - Leaflet</title>
  
  <!-- 1. Import Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
  />

  <style>
    /* 2. Bắt buộc đặt chiều cao cho container chứa bản đồ */
    body {
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Thẻ div chứa bản đồ -->
  <div id="map"></div>

  <!-- 3. Import Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 4. Khởi tạo bản đồ tại tọa độ Việt Nam (Kinh độ/Vĩ độ trung tâm)
    const map = L.map('map').setView([16.047079, 108.206230], 6); // Tọa độ Đà Nẵng, zoom level 6

    // 5. Thêm lớp nền bản đồ (TileLayer) từ OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 6. Thêm các Marker mẫu
    // Hà Nội
    L.marker([21.028511, 105.804817])
      .addTo(map)
      .bindPopup('<b>Hà Nội</b><br>Thủ đô Việt Nam.');

    // TP. Hồ Chí Minh
    L.marker([10.776889, 106.700806])
      .addTo(map)
      .bindPopup('<b>TP. Hồ Chí Minh</b>');

    // Quần đảo Hoàng Sa
    L.marker([16.5, 112.0])
      .addTo(map)
      .bindPopup('<b>Quần đảo Hoàng Sa</b>');

    // Quần đảo Trường Sa
    L.marker([8.65, 111.92])
      .addTo(map)
      .bindPopup('<b>Quần đảo Trường Sa</b>');
  </script>

</body>
</html>
